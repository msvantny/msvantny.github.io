name: Validate project feeds
on:
  push:
    paths:
      - 'projects.mjs'
      - 'projects.html'
      - 'publications.html'
      - 'styles.css'
      - 'assets/*-illustration.svg'
      - '.github/workflows/validate-project-feeds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check filtering and live public feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {selectFundings, selectRepositories, fundingMarkup, repositoryMarkup, FUNDINGS_API, REPOS_API} from './projects.mjs';
          assert.throws(()=>selectFundings({error:'bad'}));
          assert.throws(()=>selectRepositories({message:'rate limited'}));
          const funding=(id,year)=>({'funding-summary':[{visibility:'public',title:{title:{value:'Project '+id}},organization:{name:'Test funder'},'start-date':{year:{value:year}},'end-date':{year:{value:'2029'}},'external-ids':{'external-id':[{'external-id-type':'grant-number','external-id-value':id,'external-id-relationship':'self'}]}}]});
          const fixture={group:[funding('older','2020'),funding('new','2025'),funding('new','2025')]};
          assert.deepEqual(selectFundings(fixture).map(p=>p.id),['new','older']);
          assert.ok(fundingMarkup([{title:'<script>',sponsor:'A&B',id:'x',years:'2025',url:'https://orcid.org'}]).includes('&lt;script&gt;'));
          const owner={login:'msvantny'};
          assert.equal(selectRepositories([{name:'fork',owner,fork:true},{name:'private',owner,private:true},{name:'archived',owner,archived:true},{name:'public',owner,pushed_at:'2026-01-01',html_url:'https://github.com/msvantny/public'}]).length,1);
          async function get(url,github=false) {
            const response=await fetch(url,{headers:github?{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN}:{Accept:'application/json'},signal:AbortSignal.timeout(30000)});
            if(!response.ok) throw new Error(url+': '+response.status);
            return response.json();
          }
          const [fundings,repos]=await Promise.all([get(FUNDINGS_API).then(selectFundings),get(REPOS_API,true).then(selectRepositories)]);
          assert.ok(fundings.length<=5 && repos.length<=5);
          assert.ok(fundings.every(p=>p.title && p.url));
          console.log('PROJECT_FEEDS_JSON='+JSON.stringify({fundings,repos}));
          console.log('Live feeds and selection checks passed.');
          JS
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile layouts
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import http from 'node:http';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const root=process.cwd();
          const server=http.createServer(async(req,res)=>{
            try {
              const pathname=new URL(req.url,'http://localhost').pathname;
              const file=path.resolve(root,'.'+pathname);
              if(!file.startsWith(root+path.sep)) {res.writeHead(403);res.end();return;}
              const types={'.html':'text/html','.css':'text/css','.mjs':'text/javascript','.js':'text/javascript','.svg':'image/svg+xml'};
              res.setHeader('Content-Type',types[path.extname(file)]||'application/octet-stream');
              res.end(await fs.readFile(file));
            }catch {res.writeHead(404);res.end();}
          }).listen(8765);
          const browser=await chromium.launch({headless:true});
          try {
            for(const width of [390,768,1280]) {
              const page=await browser.newPage({viewport:{width,height:1000}});
              for(const name of ['projects','publications']) {
                await page.goto('http://localhost:8765/'+name+'.html');
                await page.locator('.heading-illustration').waitFor();
                const result=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth,image:document.querySelector('.heading-illustration').getBoundingClientRect().width,loaded:document.querySelector('.heading-illustration').naturalWidth>0}));
                assert.equal(result.overflow,false,name+' horizontal overflow at '+width);
                assert.equal(result.loaded,true,name+' illustration did not load');
                assert.ok(result.image<=(width<=600?64:96),name+' illustration too large');
                if(name==='projects') {
                  await page.waitForFunction(()=>document.getElementById('funding-status').textContent.includes('Checked'),{timeout:25000});
                  assert.equal(await page.locator('#funded-project-list > li').count(),5);
                  assert.ok(await page.locator('#github-project-list > li').count()<=5);
                }
                console.log('LAYOUT_PASS '+name+' '+width+'px '+JSON.stringify(result));
              }
              await page.close();
            }
          } finally {await browser.close();server.close();}
          JS
