name: Validate conferences
on:
  push:
    paths:
      - 'conferences.html'
      - 'conferences.mjs'
      - 'conferences-archive.html'
      - 'videos.mjs'
      - 'videos.html'
      - 'tools/update-youtube-playlist.py'
      - 'tools/conferences-feed.gs'
      - 'tests/conferences.test.mjs'
      - '.github/workflows/validate-conferences.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/conferences.test.mjs
