name: Validate conferences
on:
  push:
    paths:
      - 'conferences.html'
      - 'conferences.mjs'
      - 'conferences-archive.html'
      - 'videos.mjs'
      - 'videos.html'
      - 'tools/update-youtube-playlist.py'
      - 'tools/conferences-feed.gs'
      - 'tests/conferences.test.mjs'
      - 'tests/security.test.mjs'
      - '*.html'
      - 'publications.mjs'
      - 'projects.mjs'
      - 'professional-activities.mjs'
      - '.github/workflows/validate-conferences.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs

